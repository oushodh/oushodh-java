name: Release

# Publishes to Maven Central through the Central Portal when a v* tag is pushed.
# Maven Central has no trusted publishing (OIDC), so it needs these repository secrets.
# They are not set yet:
#   MAVEN_CENTRAL_USERNAME  the user name of a Central Portal user token
#   MAVEN_CENTRAL_PASSWORD  the password of that token
#   SIGNING_KEY             an ASCII-armored PGP private key
#   SIGNING_KEY_PASSWORD    the password of that key

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Check that the tag matches the version
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version=//p' gradle.properties)"
      - run: ./gradlew build publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
